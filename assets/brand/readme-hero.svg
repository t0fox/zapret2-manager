    <text x="840" y="101">Диагностика</text>
    <text x="955" y="101">Система</text>
  </g>
  <text x="242" y="101" fill="#58A6FF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700">Главная</text>
  <rect x="235" y="116" width="70" height="3" rx="1.5" fill="#58A6FF"/>

  <text x="70" y="184" fill="#F1F3F6" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="37" font-weight="760" letter-spacing="-.6">Единое управление zapret2 на OpenWrt</text>
  <text x="70" y="219" fill="#929AA8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="500">Стратегии, Z2K Core, DNS, прокси и диагностика — в одном LuCI-интерфейсе.</text>

