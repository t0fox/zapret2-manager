    <text x="295" y="24" fill="#D8DEE9">Z2K Core</text>

    <rect x="419" width="248" height="38" rx="19" fill="#1C1F26" stroke="#343A45"/>
    <circle cx="439" cy="19" r="5" fill="#22C55E"/>
    <text x="455" y="24" fill="#D8DEE9">DNS · Proxy · Diagnostics</text>
