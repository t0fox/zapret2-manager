<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">zapret2.manager</title>
  <desc id="desc">Hero banner for zapret2.manager, an OpenWrt management layer for zapret2.</desc>
  <defs>
