  <text x="106" y="45" fill="#F1F3F6" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="720" letter-spacing="-.3">zapret2.manager</text>
  <text x="1032" y="42" text-anchor="end" fill="#929AA8" font-family="SFMono-Regular, Consolas, ui-monospace, monospace" font-size="14">OpenWrt · LuCI</text>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="620" fill="#AEB6C4">
    <text x="242" y="101">Главная</text>
