<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">zapret2.manager</title>
  <desc id="desc">zapret2.manager — единый LuCI-интерфейс управления zapret2 на OpenWrt.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17191F"/>
      <stop offset="0.58" stop-color="#16181D"/>
      <stop offset="1" stop-color="#171823"/>
    </linearGradient>
    <linearGradient id="topbar" x1="0" y1="0" x2="1200" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#191B26"/>
      <stop offset="1" stop-color="#17191F"/>
    </linearGradient>
    <linearGradient id="iconBg" x1="42" y1="16" x2="88" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset="0.5" stop-color="#665BFF"/>
      <stop offset="1" stop-color="#7557FF"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="242" y1="0" x2="862" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF"/>
      <stop offset="0.6" stop-color="#665BFF"/>
      <stop offset="1" stop-color="#7557FF"/>
    </linearGradient>
    <radialGradient id="brandGlow" cx="0" cy="0" r="1" gradientTransform="translate(250 200) rotate(8) scale(390 170)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#665BFF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#665BFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="logoShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="318" rx="24" fill="url(#shell)" stroke="#30343D" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="68" rx="22" fill="url(#topbar)"/>
  <path d="M2 70H1198" stroke="#30343D"/>
  <rect x="2" y="70" width="1196" height="50" fill="#16181D"/>
  <path d="M2 120H1198" stroke="#2B3038"/>
  <rect x="2" y="120" width="1196" height="198" rx="0" fill="url(#brandGlow)"/>

  <g filter="url(#logoShadow)">
    <rect x="42" y="15" width="46" height="46" rx="12" fill="url(#iconBg)"/>
    <path d="M53 23H67V33L59 44V53H53C50.791 53 49 51.209 49 49V27C49 24.791 50.791 23 53 23Z" fill="#F8FAFC"/>
    <path d="M74 23H78C80.209 23 82 24.791 82 27V49C82 51.209 80.209 53 78 53H65V43L73 32V27C73 24.791 73.448 23 74 23Z" fill="#F8FAFC"/>
