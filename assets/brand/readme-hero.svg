      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientTransform="translate(320 170) rotate(20) scale(420 260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f46e5" stop-opacity=".34"/>
