name: Clean-install lifecycle regression

# Regression coverage for the clean-install corrective work:
#   catalog read invariant, postinst contract, staged dashboard, components
#   truth model, engine producer/catalog gating, Z2K materialization,
#   capability proof gates, and worker rollback injections.
#
# Independent jobs run in parallel; inside a job node --test collects every
# failure before exiting non-zero. The worker-sandbox job exercises the REAL
# transactional worker under stubbed absolute paths with injected failures.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-install-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ucode build prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libjson-c-dev

      - name: Build pinned ucode interpreter
        run: ./scripts/test/install-ucode.sh /opt/ucode

      - name: Catalog + install lifecycle contracts (product)
        env:
          UCODE_BIN: /opt/ucode/bin/ucode
          LD_LIBRARY_PATH: /opt/ucode/lib
        run: |
          node --test \
            tests/product/strategy-catalog-read-invariant.test.mjs \
            tests/product/clean-install-contract.test.mjs \
            tests/product/z2k-materialization.test.mjs \
            tests/product/engine-stock-authority.test.mjs \
            tests/product/engine-capability-inventory.audit.test.mjs \
            tests/product/engine-worker-transaction.test.mjs \
            tests/product/avatar-strategy-catalog.test.mjs \
            tests/product/strategy-catalog-authority.test.mjs \
            tests/product/tg-install-owner-contract.test.mjs \
            tests/product/tg-provider-transaction.test.mjs

      - name: Frontend contracts (ui)
        run: |
          node --test \
            tests/ui/app-shell-fast-status.test.mjs \
            tests/ui/dashboard-staged-loading.test.mjs \
            tests/ui/luci-module-factory-contract.test.mjs \
            tests/ui/dashboard-active-strategy.test.mjs \
            tests/ui/dashboard-parity-contract.test.mjs \
            tests/ui/dashboard-transport-contract.test.mjs \
            tests/ui/p01-v3-dashboard-visual-unification.test.mjs \
            tests/ui/p01-v6-dashboard-final-density.test.mjs \
            tests/ui/system-components-model.test.mjs \
            tests/ui/system-components-page.test.mjs \
            tests/ui/system-components-navigation.test.mjs \
            tests/ui/runtime-state-contract.test.mjs

      - name: Lua gates (native)
        env:
          UCODE_BIN: /opt/ucode/bin/ucode
          LD_LIBRARY_PATH: /opt/ucode/lib
        run: |
          node --test \
            tests/native/test_lua_init_smoke.test.mjs
