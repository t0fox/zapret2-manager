name: Apply verified backend contract fix

on:
  push:
    branches:
      - feat/holyversion-reference-parity

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.head_commit.message == 'ci apply verified backend contract fix' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout triggering exact HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/holyversion-reference-parity
          fetch-depth: 0

      - name: Verify and apply bounded patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          base64 -d .github/z2m-backend-contract.patch.b64 > /tmp/z2m-backend-contract.patch.gz
          echo '287e232b9b213dcd341842dd0279088eb70cc6ed3482588e58e22aab43af9274  /tmp/z2m-backend-contract.patch.gz' | sha256sum -c -
          gzip -dc /tmp/z2m-backend-contract.patch.gz > /tmp/z2m-backend-contract.patch
          test "$(grep -c '^diff --git ' /tmp/z2m-backend-contract.patch)" -eq 2
          grep '^diff --git ' /tmp/z2m-backend-contract.patch | tee /tmp/z2m-backend-contract-paths.txt
          if grep -E '(^|/)(tg-ws-proxy|z2m-proxy|proxycfg|z2m-proxy-provider|proxy-package)' /tmp/z2m-backend-contract-paths.txt; then
            echo 'Refusing patch: TG Proxy path present.' >&2
            exit 1
          fi
          git apply --check /tmp/z2m-backend-contract.patch
          git apply /tmp/z2m-backend-contract.patch

      - name: Verify focused backend contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/frontend-backend-contract.test.mjs
          node tests/orchestra-rpc-contract.test.mjs
          node --test tests/source-encoding.test.mjs

      - name: Commit verified contract changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/z2m-backend-contract.patch.b64 .github/z2m-backend-contract.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep -E '(^|/)(tg-ws-proxy|z2m-proxy|proxycfg|z2m-proxy-provider|proxy-package)'; then
            echo 'Refusing commit: TG Proxy path changed.' >&2
            exit 1
          fi
          git commit -m 'docs: freeze domain hub and monitor RPC contracts'
          git push origin HEAD:feat/holyversion-reference-parity
