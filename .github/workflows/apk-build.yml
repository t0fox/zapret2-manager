name: OpenWrt APK build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run release contract tests
        run: node --test tests/release/version-contract.test.mjs tests/release/build-manifest.test.mjs

      - name: Install OpenWrt SDK host tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential gawk gettext git python3 rsync unzip file curl wget zstd ca-certificates

      - name: Build manager APKs
        run: scripts/release/build-apk.sh

      - name: Verify release artifacts
        run: node scripts/release/verify-artifacts.mjs dist

      - name: Write artifact summary
        if: always()
        run: |
          set -eu
          summary="${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          {
            printf '## OpenWrt APK build (%s)\n\n' "$GITHUB_SHA"
            if [ -f dist/build-manifest.json ]; then
              node --input-type=module -e '
                import fs from "node:fs";
                const m = JSON.parse(fs.readFileSync("dist/build-manifest.json", "utf8"));
                console.log("| Artifact | Size | SHA256 |\n|---|---|---|");
                for (const a of m.artifacts)
                  console.log(`| ${a.filename} | ${a.bytes} | \`${a.sha256.slice(0, 16)}…\` |`);
                console.log(`\nCommit: ${m.project.gitCommit}  Version: ${m.package.version}-r${m.package.release}`);
              ' >> "$summary"
            else
              printf 'Build did not produce dist/build-manifest.json — see raw logs.\n' >> "$summary"
            fi
          }

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: z2m-apk-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling main prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: main-latest
        run: |
          NOTES=$(printf 'Rolling build of main at %s.\n\nInstall on the router:\n\n    wget <asset URL>\n    apk add --allow-untrusted ./zapret2-manager-*.apk ./luci-app-zapret2-manager-*.apk\n\nVerify checksums against SHA256SUMS before installing.' "$GITHUB_SHA")
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest main build" \
            --notes "$NOTES" \
            dist/*.apk dist/SHA256SUMS dist/build-manifest.json
