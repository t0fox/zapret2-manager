name: OpenWrt full APK build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run release contract tests
        run: node --test tests/release/*.test.mjs

      - name: Install OpenWrt SDK host tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential gawk gettext git python3 rsync unzip file curl wget zstd ca-certificates

      - name: Build full manager APK
        run: scripts/release/build-apk.sh

      - name: Verify release artifact
        run: node scripts/release/verify-artifacts.mjs dist

      - name: Write artifact summary
        if: always()
        run: |
          set -eu
          summary="${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          {
            printf '## OpenWrt full APK build (%s)\n\n' "$GITHUB_SHA"
            if [ -f dist/build-manifest.json ]; then
              node --input-type=module -e '
                import fs from "node:fs";
                const m = JSON.parse(fs.readFileSync("dist/build-manifest.json", "utf8"));
                const a = m.artifact;
                console.log(`| Artifact | Size | SHA256 |\n|---|---|---|`);
                console.log(`| ${a.filename} | ${a.bytes} | \`${a.sha256.slice(0, 16)}…\` |`);
                console.log(`\nCommit: ${m.project.gitCommit}  Version: ${m.package.version}-r${m.package.release}`);
              ' >> "$summary"
            else
              printf 'Build did not produce dist/build-manifest.json — see raw logs.\n' >> "$summary"
            fi
          }

      - name: Upload full APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: z2m-full-apk-${{ github.sha }}
          path: |
            dist/zapret2-manager-full-*.apk
            dist/SHA256SUMS
            dist/build-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling main prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: main-latest
        run: |
          set -eu
          NOTES=$(printf 'Rolling build of main at %s.\n\nDownload the three release files, verify SHA256SUMS, then install the single package:\n\n    sha256sum -c SHA256SUMS\n    apk add --allow-untrusted ./zapret2-manager-full-*.apk' "$GITHUB_SHA")
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest main full APK build" \
            --notes "$NOTES" \
            dist/zapret2-manager-full-*.apk \
            dist/SHA256SUMS \
            dist/build-manifest.json
