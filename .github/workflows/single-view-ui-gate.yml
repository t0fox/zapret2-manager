name: Production release gate

on:
  push:
    branches:
      - main
      - feat/holyversion-reference-parity
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend_tests:
    name: Frontend unit and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Run every discovered frontend test
        shell: bash
        run: |
          set -o pipefail
          node tools/run-node-tests.mjs frontend 2>&1 | tee frontend-tests.log

      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-tests-${{ github.sha }}
          path: frontend-tests.log
          if-no-files-found: error
          retention-days: 14

  backend_tests:
    name: Backend unit and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Run every discovered backend test
        shell: bash
        run: |
          set -o pipefail
          node tools/run-node-tests.mjs backend 2>&1 | tee backend-tests.log

      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-tests-${{ github.sha }}
          path: backend-tests.log
          if-no-files-found: error
          retention-days: 14

  repository_gate:
    name: Complete repository gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Fetch pinned StressOzz reference
        shell: bash
        run: git fetch --no-tags https://github.com/StressOzz/Zapret-Manager.git b3269f852ed2d70b4c24918750c6b5b46b8b6a69

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Run complete repository test gate
        shell: bash
        run: |
          set -o pipefail
          chmod +x tools/run-all-tests.sh
          tools/run-all-tests.sh 2>&1 | tee repository-gate.log

      - name: Upload complete gate diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-gate-${{ github.sha }}
          path: repository-gate.log
          if-no-files-found: error
          retention-days: 14

  javascript_syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Check every JavaScript module
        shell: bash
        run: |
          set -o pipefail
          {
            mapfile -d '' files < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -print0 | sort -z)
            if (( ${#files[@]} == 0 )); then
              echo 'Refusing to pass: no JavaScript modules found.' >&2
              exit 2
            fi
            status=0
            for file in "${files[@]}"; do
              echo "CHECK $file"
              node --check "$file" || status=1
            done
            exit "$status"
          } 2>&1 | tee javascript-syntax.log

      - name: Upload syntax diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: javascript-syntax-${{ github.sha }}
          path: javascript-syntax.log
          if-no-files-found: error
          retention-days: 14

  static_contracts:
    name: Static RPC, ACL and UI contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Validate static contracts
        shell: bash
        run: |
          set -o pipefail
          {
            node -e "JSON.parse(require('fs').readFileSync('luci-app-zapret2-manager/files/usr/share/luci/menu.d/luci-app-zapret2-manager.json','utf8'))"
            node -e "JSON.parse(require('fs').readFileSync('luci-app-zapret2-manager/files/usr/share/rpcd/acl.d/luci-app-zapret2-manager.json','utf8'))"
            node - <<'NODE'
          const fs = require('fs');
          for (const file of ['z2m-ui.css', 'z2m-components.css']) {
            const cssPath = `luci-app-zapret2-manager/files/www/luci-static/resources/view/zapret2-manager/${file}`;
            const source = fs.readFileSync(cssPath, 'utf8');
            let depth = 0;
            for (const char of source) {
              if (char === '{') depth++;
              if (char === '}') depth--;
              if (depth < 0) throw new Error(`${file}: unbalanced closing brace`);
            }
            if (depth !== 0) throw new Error(`${file}: unbalanced braces`);
          }
          NODE
            if grep -R -nE "require view\\.zapret2-manager\\..*-legacy|return Legacy|children\\.forEach" \
              luci-app-zapret2-manager/files/www/luci-static/resources/view/zapret2-manager \
              --include='*.js'; then
              echo 'Legacy wrapper or live HTMLCollection iteration detected' >&2
              exit 1
            fi
            if grep -R -nE "@import|https?://" \
              luci-app-zapret2-manager/files/www/luci-static/resources/view/zapret2-manager \
              --include='*.css'; then
              echo 'External UI asset detected' >&2
              exit 1
            fi
          } 2>&1 | tee static-contracts.log

      - name: Upload static diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: static-contracts-${{ github.sha }}
          path: static-contracts.log
          if-no-files-found: error
          retention-days: 14

  release_verdict:
    name: Exact-head CI verdict
    if: always()
    needs:
      - frontend_tests
      - backend_tests
      - repository_gate
      - javascript_syntax
      - static_contracts
    runs-on: ubuntu-latest
    steps:
      - name: Reject failed, cancelled, skipped or unknown gates
        shell: bash
        run: |
          set -euo pipefail
          declare -A results=(
            [frontend_tests]='${{ needs.frontend_tests.result }}'
            [backend_tests]='${{ needs.backend_tests.result }}'
            [repository_gate]='${{ needs.repository_gate.result }}'
            [javascript_syntax]='${{ needs.javascript_syntax.result }}'
            [static_contracts]='${{ needs.static_contracts.result }}'
          )
          failed=0
          for gate in "${!results[@]}"; do
            result="${results[$gate]}"
            printf '%s=%s\n' "$gate" "$result"
            if [[ "$result" != 'success' ]]; then
              failed=1
            fi
          done
          exit "$failed"
