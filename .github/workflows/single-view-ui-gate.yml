name: Single-view UI gate

on:
  push:
    branches:
      - feat/strategy-first-integration
    paths:
      - 'luci-app-zapret2-manager/**'
      - 'tests/**'
      - 'tools/**'
      - 'docs/frontend-backend-contract.md'
      - '.github/workflows/single-view-ui-gate.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'luci-app-zapret2-manager/**'
      - 'tests/**'
      - 'tools/**'
      - 'docs/frontend-backend-contract.md'
      - '.github/workflows/single-view-ui-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run single-view contract tests
        run: |
          node --test \
            tests/ui/single-view-manager.test.mjs \
            tests/ui/manager-cosmetic-redesign.test.mjs \
            tests/ui/single-view-overview-strategy.test.mjs \
            tests/ui/single-view-services-lists-dns.test.mjs \
            tests/ui/single-view-proxy.test.mjs \
            tests/ui/single-view-monitor-maintenance.test.mjs \
            tests/auto-strategy-ui.test.mjs \
            tests/orchestra-strategy-ui.test.mjs \
            tests/packaging.test.mjs

      - name: Run complete repository test gate
        shell: bash
        run: |
          chmod +x tools/run-all-tests.sh
          tools/run-all-tests.sh

      - name: Check LuCI JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find luci-app-zapret2-manager/files/www/luci-static/resources/view/zapret2-manager -maxdepth 1 -name '*.js' -print0)

      - name: Validate menu JSON and CSS balance
        shell: bash
        run: |
          node -e "JSON.parse(require('fs').readFileSync('luci-app-zapret2-manager/files/usr/share/luci/menu.d/luci-app-zapret2-manager.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('luci-app-zapret2-manager/files/usr/share/rpcd/acl.d/luci-app-zapret2-manager.json','utf8'))"
          node - <<'NODE'
          const fs = require('fs');
          for (const file of ['z2m-ui.css', 'z2m-components.css']) {
            const path = `luci-app-zapret2-manager/files/www/luci-static/resources/view/zapret2-manager/${file}`;
            const source = fs.readFileSync(path, 'utf8');
            let depth = 0;
            for (const char of source) {
              if (char === '{') depth++;
              if (char === '}') depth--;
              if (depth < 0) process.exit(1);
            }
            if (depth !== 0) process.exit(1);
          }
          NODE

      - name: Reject runtime legacy wrappers and external UI assets
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE "require view\.zapret2-manager\..*-legacy|return Legacy|children\.forEach" \
            luci-app-zapret2-manager/files/www/luci-static/resources/view/zapret2-manager \
            --include='*.js'; then
            echo 'Legacy wrapper or live HTMLCollection iteration detected' >&2
            exit 1
          fi
          if grep -R -nE "@import|https?://" \
            luci-app-zapret2-manager/files/www/luci-static/resources/view/zapret2-manager \
            --include='*.css'; then
            echo 'External UI asset detected' >&2
            exit 1
          fi
