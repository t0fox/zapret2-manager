name: Knowledge CI

# Heavy knowledge verification is manual-only by design: it bootstraps a
# pinned Quartz checkout and builds both doc sites. Publication is decoupled
# (Quartz Pages owns its own push trigger), so this workflow never gates
# ordinary development pushes.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-ci-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # Independent check 1: vault metadata/link/authority validation.
  validate:
    name: Knowledge validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup deterministic Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Metadata + link + authority + legacy validation
        run: node scripts/validate-knowledge.mjs

  # Independent check 2: build-independent contract tests. The post-build
  # public leak test is intentionally excluded here; it runs against the
  # built artifact in the privacy-smoke job.
  contracts:
    name: Knowledge contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup deterministic Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Contract tests (one runner, all files, every failure reported)
        run: |
          set -eu
          files=
          for file in tests/knowledge/*.test.mjs; do
            case "$file" in
              tests/knowledge/public-leak.test.mjs) continue ;;
            esac
            files="$files $file"
          done
          # A single node --test invocation executes every listed file even
          # when earlier files fail; the aggregate exit code stays non-zero.
          node --test $files

  # Independent check 3: internal Quartz site.
  internal-docs:
    name: Internal docs build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup deterministic Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify pinned Quartz checkout
        run: node scripts/docs.mjs verify

      - name: Build internal Quartz site
        run: node scripts/docs.mjs build internal

  # Independent check 4: public production site (dependency root for the smoke).
  public-docs:
    name: Public docs build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup deterministic Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify pinned Quartz checkout
        run: node scripts/docs.mjs verify

      - name: Quartz public production build
        run: node scripts/docs.mjs build public --production

      - name: Upload verified public docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-public-${{ github.sha }}
          path: .artifacts/docs-public
          if-no-files-found: error

  # Dependency-gated check: privacy/leak smoke runs against the exact
  # uploaded artifact. If the public build failed, this job is skipped and
  # the failure is surfaced by the public-docs row + final gate instead of
  # producing a secondary misleading failure about a missing directory.
  privacy-smoke:
    name: Public privacy smoke
    needs: public-docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup deterministic Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download the verified public docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-public-${{ github.sha }}
          path: .artifacts/docs-public

      - name: Post-build privacy/leak smoke test
        run: node --test tests/knowledge/public-leak.test.mjs

  # Final aggregation gate: red whenever any required independent check
  # failed or was cancelled. A dependency skip is never counted as success;
  # it only appears together with an already-failed prerequisite.
  result:
    name: Final Knowledge Result
    needs: [validate, contracts, internal-docs, public-docs, privacy-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required results and write step summary
        env:
          R_VALIDATE: ${{ needs.validate.result }}
          R_CONTRACTS: ${{ needs.contracts.result }}
          R_INTERNAL: ${{ needs.internal-docs.result }}
          R_PUBLIC: ${{ needs.public-docs.result }}
          R_SMOKE: ${{ needs.privacy-smoke.result }}
        run: |
          set -eu
          summary="${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          status() {
            case "$1" in
              success) printf '✅ PASS' ;;
              failure) printf '❌ FAIL' ;;
              cancelled) printf '🛑 CANCELLED' ;;
              skipped) printf '⏭ SKIPPED' ;;
              *) printf '⚠️ %s' "$1" ;;
            esac
          }
          {
            printf '## Knowledge CI\n\n'
            printf '| Check | Result |\n|---|---|\n'
            printf '| Metadata / links / policy | %s |\n' "$(status "$R_VALIDATE")"
            printf '| Contract tests | %s |\n' "$(status "$R_CONTRACTS")"
            printf '| Internal docs | %s |\n' "$(status "$R_INTERNAL")"
            printf '| Public docs | %s |\n' "$(status "$R_PUBLIC")"
            printf '| Public privacy smoke | %s |\n' "$(status "$R_SMOKE")"
            printf '\nRaw logs for each job remain available under this run.\n'
          } >> "$summary"

          failed=0
          for pair in "validate:$R_VALIDATE" "contracts:$R_CONTRACTS" \
                      "internal-docs:$R_INTERNAL" "public-docs:$R_PUBLIC"; do
            name=${pair%%:*}
            result=${pair#*:}
            if [ "$result" != success ]; then
              printf 'Required check failed: %s (%s)\n' "$name" "$result" >> "$summary"
              failed=1
            fi
          done
          if [ "$R_SMOKE" = failure ] || [ "$R_SMOKE" = cancelled ]; then
            printf 'Required check failed: privacy-smoke (%s)\n' "$R_SMOKE" >> "$summary"
            failed=1
          fi
          # A skipped smoke is acceptable only while its prerequisite already
          # failed, which independently fails the gate above.

          if [ "$failed" -eq 1 ]; then
            printf '\nOverall: ❌ FAILED\n' >> "$summary"
            exit 1
          fi
          printf '\nOverall: ✅ PASSED\n' >> "$summary"
