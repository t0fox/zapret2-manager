name: Zapret2 Manager RC release

on:
  push:
    tags:
      - 'v*-r*-rc*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact RC tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate RC tag
        run: node scripts/release/check-tag.mjs "${GITHUB_REF_NAME}"

      - name: Run release contract tests
        run: node --test tests/release/*.test.mjs

      - name: Install OpenWrt SDK host tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential gawk gettext git python3 rsync unzip file curl wget zstd ca-certificates

      - name: Build manager APKs
        run: scripts/release/build-apk.sh

      - name: Verify release artifacts
        run: node scripts/release/verify-artifacts.mjs dist

      - name: Upload RC build artifact
        uses: actions/upload-artifact@v4
        with:
          name: z2m-apk-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Create immutable GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --prerelease \
            --generate-notes \
            dist/*.apk dist/SHA256SUMS dist/build-manifest.json
