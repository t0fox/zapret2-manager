name: Apply LuCI loader fix

on:
  push:
    branches:
      - fix/luci-helper-module-namespace
    paths:
      - 'tools/apply-luci-loader-fix.py'
      - '.github/workflows/apply-luci-loader-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply mechanical migration
        run: python3 tools/apply-luci-loader-fix.py

      - name: Verify focused regression tests
        run: |
          node --test \
            tests/ui/luci-helper-module-namespace.test.mjs \
            tests/packaging.test.mjs

      - name: Check generated diff
        run: |
          git diff --check
          git status --short

      - name: Commit production fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            luci-app-zapret2-manager/files/www/luci-static/resources/view/zapret2-manager \
            luci-app-zapret2-manager/files/usr/share/luci/menu.d/luci-app-zapret2-manager.json \
            luci-app-zapret2-manager/Makefile \
            zapret2-manager-full/Makefile
          git commit -m 'fix: satisfy LuCI loader and remove duplicate tabs'
          git push origin HEAD:${{ github.ref_name }}
