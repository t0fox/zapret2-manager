name: Apply Stage 3 repair

on:
  push:
    branches:
      - docs/video-found-ui-correctness-design
    paths:
      - '.github/workflows/export-pr21-source.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: docs/video-found-ui-correctness-design

      - name: Reconstruct and verify reviewed patch
        shell: bash
        run: |
          cat > /tmp/stage3-repair.patch.gz.b64 <<'PATCH_B64'

PATCH_B64
          base64 -d /tmp/stage3-repair.patch.gz.b64 | gzip -dc > /tmp/stage3-repair.patch
          echo 'feb7bfb430a01f5076e58e71905f07c16acea7facb7d37e0763fbb9ef02e0a79  /tmp/stage3-repair.patch' | sha256sum -c -
          git apply --check /tmp/stage3-repair.patch

      - name: Apply Stage 3 implementation and remove bootstrap workflow
        shell: bash
        run: |
          git apply /tmp/stage3-repair.patch
          rm -f .github/workflows/export-pr21-source.yml
          git diff --check
          test ! -e etc
          test ! -e usr
          test ! -e www

      - name: Commit and push exact implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m 'fix: complete Stage 3 correctness integration'
          git push origin HEAD:docs/video-found-ui-correctness-design
