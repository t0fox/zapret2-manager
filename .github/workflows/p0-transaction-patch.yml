name: Apply P0 transaction patch

on:
  push:
    branches:
      - feat/holyversion-reference-parity

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'ci: apply p0 transaction patch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout triggering HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/holyversion-reference-parity
          fetch-depth: 0

      - name: Apply exact guarded replacements
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one guarded match, found {count}')
              p.write_text(text.replace(old, new, 1))

          service = 'zapret2-manager/files/usr/libexec/zapret2-manager/service.uc'
          replace_once(service,
              "import { read_var, set_var } from './apply.uc';",
              "import { read_var, set_var, restore_whole_file, config_sha256 } from './apply.uc';")
          replace_once(service,
              "\t\trun('cp -f ' + PATHS.applied_conf + ' ' + LASTGOOD_DIR + '/ 2>/dev/null');\n\t\trun('cp -f ' + PATHS.uci_conf + ' ' + LASTGOOD_DIR + '/ 2>/dev/null');",
              "\t\tlet configBytes = readfile(PATHS.applied_conf);\n\t\tlet uciBytes = readfile(PATHS.uci_conf);\n\t\tif (configBytes == null) configBytes = '';\n\t\tif (uciBytes == null) uciBytes = '';\n\t\twritefile(LASTGOOD_DIR + '/' + basename(PATHS.applied_conf), configBytes);\n\t\twritefile(LASTGOOD_DIR + '/' + basename(PATHS.uci_conf), uciBytes);")
          replace_once(service,
              "\t\trun('cp -f ' + configSnapshot + ' ' + PATHS.applied_conf);\n\t\trun('cp -f ' + uciSnapshot + ' ' + PATHS.uci_conf);\n\t\ttry { unlink(PENDING); } catch (e) { }\n\t\t// Re-capture the applied hash for the RESTORED config so drift does not\n\t\t// false-positive against the pre-rollback (changed) baseline.\n\t\tcapture_applied_hash();\n\t\tlet r = run(UPSTREAM_INIT + ' restart');\n\t\tevent('ui', 'rollback', 'crit',\n\t\t\t'ROLLBACK applied (link not confirmed within ' + ROLLBACK_TTL + 's) rc=' + r.rc,\n\t\t\t{ rc: r.rc, rollback_ttl: ROLLBACK_TTL });\n\t\treturn { ok: r.rc == 0, action: 'rollback', rc: r.rc };",
              "\t\tlet configBytes = readfile(configSnapshot);\n\t\tlet uciBytes = readfile(uciSnapshot);\n\t\tif (configBytes == null || uciBytes == null)\n\t\t\treturn { ok: false, action: 'rollback', code: 'ENOLASTGOOD', error: 'snapshot read failed' };\n\t\tlet expected = sha256_file(configSnapshot);\n\t\tlet restored = restore_whole_file(PATHS.applied_conf, configBytes);\n\t\twritefile(PATHS.uci_conf, uciBytes);\n\t\tlet configRestored = restored != null && config_sha256() == expected && readfile(PATHS.applied_conf) == configBytes;\n\t\tif (!configRestored)\n\t\t\treturn { ok: false, action: 'rollback', code: 'EROLLBACK', error: 'exact config restore verification failed', configRestored: false };\n\t\ttry { unlink(PENDING); } catch (e) { }\n\t\tcapture_applied_hash();\n\t\tlet r = run(UPSTREAM_INIT + ' restart');\n\t\tevent('ui', 'rollback', 'crit',\n\t\t\t'ROLLBACK exact snapshot restored rc=' + r.rc,\n\t\t\t{ rc: r.rc, rollback_ttl: ROLLBACK_TTL, configRestored: configRestored });\n\t\treturn { ok: r.rc == 0, action: 'rollback', rc: r.rc, configRestored: configRestored };")

          gate = 'tests/ucode-no-sugar.test.sh'
          replace_once(gate,
              "    if ! grep -q \"import .*$u\" \"$1\"; then",
              "    flattened=$(tr '\\n' ' ' < \"$1\")\n    if ! printf '%s\\n' \"$flattened\" | grep -Eq \"import[[:space:]]*\\{[^}]*([^A-Za-z0-9_]|^)$u([^A-Za-z0-9_]|$)[^}]*\\}[[:space:]]*from\"; then")
          PY

      - name: Verify focused P0 contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/production-transaction.test.mjs \
            tests/native-preflight-production.test.mjs \
            tests/profiles-apply.test.mjs
          bash tests/ucode-no-sugar.test.sh
          node --test tests/source-encoding.test.mjs

      - name: Commit verified patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/p0-transaction-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            zapret2-manager/files/usr/libexec/zapret2-manager/service.uc \
            tests/ucode-no-sugar.test.sh \
            .github/workflows/p0-transaction-patch.yml
          git diff --cached --check
          git commit -m 'fix(apply): make manual rollback exact and verified'
          git push origin HEAD:feat/holyversion-reference-parity
