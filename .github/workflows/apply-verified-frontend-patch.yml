name: Apply verified frontend patch

on:
  push:
    branches:
      - feat/holyversion-reference-parity

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.head_commit.message == 'ci apply verified frontend patch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout triggering exact HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/holyversion-reference-parity
          fetch-depth: 0

      - name: Verify and apply bounded patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          chunks=(.github/z2m-frontend-patch.chunk-*)
          test "${#chunks[@]}" -eq 33
          cat "${chunks[@]}" > /tmp/z2m-frontend-patch.b64
          base64 -d /tmp/z2m-frontend-patch.b64 > /tmp/z2m-frontend-patch.gz
          echo '3737d2e333f157bbeb2c3328b872918a67ca928f3f3daf7c9073561128174e05  /tmp/z2m-frontend-patch.gz' | sha256sum -c -
          gzip -dc /tmp/z2m-frontend-patch.gz > /tmp/z2m-frontend.patch
          test "$(grep -c '^diff --git ' /tmp/z2m-frontend.patch)" -eq 30
          grep '^diff --git ' /tmp/z2m-frontend.patch | tee /tmp/z2m-frontend-paths.txt
          if grep -E '(^|/)(tg-ws-proxy|z2m-proxy|proxycfg|z2m-proxy-provider|holyversion-proxy-provider|single-view-proxy|video-strategy-proxy-regressions|proxy-package)' /tmp/z2m-frontend-paths.txt; then
            echo 'Refusing patch: TG Proxy path present.' >&2
            exit 1
          fi
          git apply --check /tmp/z2m-frontend.patch
          git apply /tmp/z2m-frontend.patch

      - name: Verify all non-proxy frontend contracts
        shell: bash
        run: |
          set -euo pipefail
          files=(
            tests/auto-strategy-ui.test.mjs
            tests/orchestra-strategy-ui.test.mjs
            tests/t4-2-production-auto-ui.test.mjs
            tests/t4-3-ui-regression.test.mjs
            tests/t4-auto-strategy-ui.test.mjs
            tests/ui/draft-model.test.mjs
            tests/ui/final-fix-wave.test.mjs
            tests/ui/global-draft-apply.test.mjs
            tests/ui/holyversion-dns.test.mjs
            tests/ui/holyversion-domain-hub.test.mjs
            tests/ui/holyversion-global-apply.test.mjs
            tests/ui/holyversion-maintenance.test.mjs
            tests/ui/holyversion-monitor.test.mjs
            tests/ui/holyversion-overview-model.test.mjs
            tests/ui/holyversion-proxy.test.mjs
            tests/ui/holyversion-responsive.test.mjs
            tests/ui/holyversion-shell-overview-parity.test.mjs
            tests/ui/holyversion-strategy.test.mjs
            tests/ui/manager-cosmetic-redesign.test.mjs
            tests/ui/negative-controls.test.mjs
            tests/ui/render-harness.test.mjs
            tests/ui/rpc-semantics.test.mjs
            tests/ui/services-model.test.mjs
            tests/ui/services-parity.test.mjs
            tests/ui/single-view-manager.test.mjs
            tests/ui/single-view-monitor-maintenance.test.mjs
            tests/ui/single-view-overview-strategy.test.mjs
            tests/ui/single-view-services-lists-dns.test.mjs
            tests/ui/ui-gates.test.mjs
            tests/ui/video-drafts-service-dns-regressions.test.mjs
            tests/ui/video-navigation-regressions.test.mjs
          )
          test "${#files[@]}" -eq 31
          status=0
          for file in "${files[@]}"; do
            echo "=== $file ==="
            node --test "$file" || status=1
          done
          exit "$status"

      - name: Verify focused contracts and syntax
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/holyversion-package-contents.test.mjs \
            tests/ui/rpc-semantics.test.mjs \
            tests/ui/ui-gates.test.mjs \
            tests/ui/render-harness.test.mjs \
            tests/source-encoding.test.mjs
          while IFS= read -r file; do
            test -e "$file" || continue
            node --check "$file"
          done < <(git diff --name-only "$GITHUB_SHA" -- '*.js' '*.mjs')
          bash tests/ucode-no-sugar.test.sh

      - name: Commit verified non-proxy frontend changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/z2m-frontend-patch.chunk-*
          rm -f .github/z2m-frontend-patch.trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --name-only | grep -E '(^|/)(tg-ws-proxy|z2m-proxy|proxycfg|z2m-proxy-provider|holyversion-proxy-provider|single-view-proxy|video-strategy-proxy-regressions|proxy-package)'; then
            echo 'Refusing commit: TG Proxy path changed.' >&2
            exit 1
          fi
          git commit -m 'fix(ui): centralize domain hub and fail closed'
          git push origin HEAD:feat/holyversion-reference-parity
