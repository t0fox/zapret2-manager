name: Native foundation gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl pkg-config libjson-c-dev

      - name: Build pinned ucode v0.0.20250529
        run: scripts/test/install-ucode.sh "${{ runner.temp }}/ucode"

      - name: Run native foundation gate
        env:
          TMPDIR: ${{ runner.temp }}/z2m-native
          UCODE_BIN: ${{ runner.temp }}/ucode/bin/ucode
          UCODE_LIBRARY_PATH: ${{ runner.temp }}/ucode/lib
          UCODE_MODULE_PATH: ${{ runner.temp }}/ucode/lib/ucode
        run: scripts/test/native.sh
