name: Native foundation gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libjson-c-dev

      - name: Run native foundation gate
        env:
          TMPDIR: ${{ runner.temp }}/z2m-native
        run: scripts/test/native.sh
