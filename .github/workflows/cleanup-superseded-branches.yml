name: Cleanup superseded branches

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-superseded-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete superseded branch refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Keep only main and docs/video-found-ui-correctness-design.
          branches=(
            'codex/router-validation-luci-baseclass'
            'feat/openwrt-flowseal-combos'
            'feat/strategy-first-integration'
            'fix/backend-core-hardening'
            'fix/luci-helper-module-namespace'
            'fix/remove-compatibility-menu-tabs'
            'integration/all-active-branches'
          )

          for branch in "${branches[@]}"; do
            encoded=$(python3 - "$branch" <<'PY'
import sys
from urllib.parse import quote
print(quote(sys.argv[1], safe=''))
PY
)
            response=$(mktemp)
            status=$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
              --request DELETE \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${REPOSITORY}/git/refs/heads/${encoded}")

            case "$status" in
              204)
                echo "deleted ${branch}"
                ;;
              404)
                echo "already absent ${branch}"
                ;;
              *)
                echo "failed to delete ${branch}: HTTP ${status}" >&2
                cat "$response" >&2
                exit 1
                ;;
            esac
            rm -f "$response"
          done
