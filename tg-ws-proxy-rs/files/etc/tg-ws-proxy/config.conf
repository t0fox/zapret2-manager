# tg-ws-proxy configuration — package-shipped STOCK (inert: disabled).
#
# Manager-owned in operation: zapret2-manager proxy_config_apply rewrites this
# file atomically and keeps it at mode 0600 (MTPROTO_PROXIES may carry
# third-party upstream proxy credentials). Manual edits are overwritten on the
# next apply.
#
# Startup gates live in /etc/init.d/tg-ws-proxy: with ENABLED != 1, an empty
# or wildcard HOST, a missing/malformed secret, an invalid PORT, or a held
# port, the service REFUSES to start. Installing this package therefore never
# raises a listener.

ENABLED=0

# Listen address: the explicit LAN IPv4 of this router (e.g. 192.168.1.1), or
# a 127.x loopback for diagnostics. Empty / 0.0.0.0 / :: are REFUSED (v1 has
# no wildcard bind).
HOST=
# Listen port (provider default 1443).
PORT=1443
# Address advertised in the tg:// link; empty = HOST.
LINK_IP=

# The MTProto secret is NOT here: it lives in /etc/tg-ws-proxy/secret.conf
# (mode 0600), generated from a CSPRNG by the manager, passed to the provider
# via the TG_SECRET environment variable only (never argv).

# Pool/buffer tuning (provider defaults: pool 4, buf 256 KiB, max-connections
# auto from ulimit -n when empty).
POOL_SIZE=4
BUF_KB=256
MAX_CONNECTIONS=
# Logging: QUIET=1 suppresses all provider log output; VERBOSE=1 enables
# debug logging. Logs go to /var/log/tg-ws-proxy.log (root-only, 0600).
QUIET=0
VERBOSE=0

# Inbound FakeTLS SNI domain (ee secrets); empty = classic dd padded mode.
FAKETLS_DOMAIN=
# Telegram DC mappings, comma-separated DC:IPv4 pairs (e.g.
# 2:149.154.167.220,4:149.154.167.91). Empty = provider default (DC2 + DC4);
# omit also when relying purely on Cloudflare routing.
DC_IPS=
# Cloudflare-proxied domains / Worker domains, comma-separated, tried in
# order; CF_PRIORITY=1 tries CF before direct WS; CF_BALANCE=1 round-robins;
# DEFAULT_DOMAINS=1 appends the upstream community domain list.
CF_DOMAINS=
CF_WORKER_DOMAINS=
CF_PRIORITY=0
CF_BALANCE=0
DEFAULT_DOMAINS=0
# Upstream MTProto proxy fallback list, comma-separated
# host:port:secret entries (copy the secret EXACTLY as in the tg:// link,
# prefix included). Secret-bearing — this file stays 0600.
MTPROTO_PROXIES=
# Outbound proxy for upstream connections (http://, socks5://, socks5h://)
# and its bypass list; empty = direct.
OUTBOUND_PROXY=
NO_PROXY=
