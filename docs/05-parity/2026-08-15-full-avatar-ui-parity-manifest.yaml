    group: home
    page: dashboard
    subtab: null
    donor_file: web/js/pages/dashboard.js
    donor_interaction: Poll runtime cards, refresh, follow health shortcuts
    z2m_backend: status, events_tail, service lifecycle, current Strategy projection
    z2m_current_ui: z2m-overview.js
