schema: avatar-ui-parity-manifest.v1
title: Full Avatar UI parity closure inventory
z2m_base_head: cbe93f47e53b55dd674bbde4355670b52862e8f1
avatar_target_head: 60bc16a5ddc5f43d97d414b99920c3d13da3151a
avatar_repository: avatarDD/zapret-gui
z2m_repository: t0fox/zapret2-manager
generated_from:
  avatar:
    - web/index.html
    - web/js/app.js
    - web/js/components/sidebar.js
    - web/js/components/confirm.js
    - web/js/components/toast.js
    - web/js/components/list_ui.js
    - web/js/components/setup_ui.js
    - web/js/components/proxy_table.js
    - web/js/components/transport_select.js
    - web/js/pages
    - web/css/style.css
  z2m:
    - luci-app-zapret2-manager/files/www/luci-static/resources/view/zapret2-manager/app.js
    - luci-app-zapret2-manager/files/www/luci-static/resources/view/zapret2-manager/z2m-api.js
    - luci-app-zapret2-manager/files/www/luci-static/resources/view/zapret2-manager/z2m-shell.js
    - luci-app-zapret2-manager/files/www/luci-static/resources/view/zapret2-manager/z2m-ui.js
    - luci-app-zapret2-manager/files/www/luci-static/resources/view/zapret2-manager/z2m-ui.css
    - luci-app-zapret2-manager/files/www/luci-static/resources/view/zapret2-manager/z2m-components.css
    - luci-app-zapret2-manager/files/usr/share/rpcd/ucode/zapret2-manager.uc
    - zapret2-manager/files/usr/libexec/zapret2-manager
scope:
  keep:
    - LuCI integration
    - Graphite visual theme
    - Z2M horizontal top navigation
    - canonical Z2M RPC/backend and ownership
  include:
    - every capability already implemented by Z2M
    - usque
    - usque setup
    - WARP-in-WARP
  exclude:
    - AmneziaWG
    - sing-box
    - mihomo
    - Opera Proxy
    - Avatar-only products without a Z2M backend mapping
navigation:
  legacy_baseline:
    tabs:
      - { id: overview, label: Обзор, order: 1 }
      - { id: strategy, label: Стратегия, order: 2 }
      - { id: services, label: Сервисы и домены, order: 3 }
      - { id: blockcheck, label: BlockCheck, order: 4 }
      - { id: assets, label: Ресурсы, order: 5 }
      - { id: dns, label: DNS, order: 6 }
      - { id: proxy, label: Telegram Proxy, order: 7 }
      - { id: monitor, label: Мониторинг, order: 8 }
      - { id: maintenance, label: Обслуживание, order: 9 }
    aliases:
      - { from: "#/lists", to: "#/services" }
  avatar_derived_target:
    groups:
      - id: home
        label: Главная
        order: 1
        pages:
          - { id: dashboard, label: Главная, donor_file: web/js/pages/dashboard.js }
      - id: dpi
        label: Обход DPI (nfqws2)
        order: 2
        pages:
          - { id: control, label: Управление, donor_file: web/js/pages/control.js }
          - { id: strategies, label: Стратегии, donor_file: web/js/pages/strategies.js }
          - { id: scan, label: Подбор стратегий, donor_file: web/js/pages/strategy_scan_hub.js }
      - id: routing
        label: VPN и маршрутизация
        order: 3
        pages:
          - { id: unified-routing, label: Маршрутизация, donor_file: web/js/pages/routing_unified.js }
          - { id: warp, label: WARP/MASQUE, donor_file: web/js/pages/usque.js }
          - { id: warp-setup, label: Установка WARP, donor_file: web/js/pages/usque_setup.js }
          - { id: warp-in-warp, label: WARP-in-WARP, donor_file: web/js/pages/warp_in_warp.js }
          - { id: telegram-tunnel, label: Telegram Tunnel, donor_file: web/js/pages/tgproxy.js }
      - id: data
        label: Списки и данные
        order: 4
        pages:
          - { id: lists, label: Списки маршрутизации, donor_file: web/js/pages/lists.js }
          - { id: hostlists, label: Домены, donor_file: web/js/pages/hostlists.js }
          - { id: ipsets, label: IP-списки, donor_file: web/js/pages/ipsets.js }
          - { id: blobs, label: Блобы, donor_file: web/js/pages/blobs.js }
          - { id: lua, label: Lua-скрипты, donor_file: web/js/pages/lua_scripts.js }
          - { id: hosts, label: Hosts, donor_file: web/js/pages/hosts.js }
          - { id: dns-routing, label: DNS routing, donor_file: web/js/pages/dns_routing.js }
      - id: diagnostics
        label: Диагностика
        order: 5
        pages:
          - { id: diagnostics, label: Диагностика, donor_file: web/js/pages/diagnostics.js }
          - { id: blockcheck, label: Диагностика блокировок, donor_file: web/js/pages/blockcheck_hub.js }
          - { id: logs, label: Логи, donor_file: web/js/pages/logs.js }
          - { id: monitor, label: Мониторинг, donor_file: web/js/pages/tunnel_monitor.js }
      - id: system
        label: Система
        order: 6
        pages:
          - { id: updates, label: Обновления, donor_file: web/js/pages/update_checker.js }
          - { id: zapret, label: Zapret2, donor_file: web/js/pages/zapret_manager.js }
          - { id: autostart, label: Автозапуск, donor_file: web/js/pages/autostart.js }
          - { id: settings, label: Настройки, donor_file: web/js/pages/settings.js }
tg_contract:
  provider_choice: [Go, Rust]
  installed_version: visible
  package_version: visible
  latest_version: visible
  available_versions: required
  version_selector: required
  source_selection: required_when_supported
  current_backend_gap:
    - proxy_provider_catalog returns latestOnly=true
    - proxy_provider_check_updates resolves one latest release only
    - install accepts provider and checkToken, not version/source
    - no historical version enumeration RPC exists
    - no selectable source enumeration RPC exists
  forbidden_copy:
    - Только latest compatible
    - Только из доверенного APK feed
